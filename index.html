// ── PRECARGA DESDE ARCHIVO DE ETIQUETAS (ZPL / MercadoEnvíos) ──

// Mapa de cuentas MercadoEnvíos (sender_id) -> empresa registrada en la app.
// Para agregar una nueva cuenta, añade aquí su número de remitente.
const REMITENTE_EMPRESA = {
  '651703010': 'Cybernetic',
  '688204963': 'Mascokits',
};

function decodeZpl(s) {
  // Decodifica escapes hex tipo _C3_AD (UTF-8) usados con ^FH
  return s.replace(/(?:_[0-9A-Fa-f]{2})+/g, m => {
    try { return decodeURIComponent(m.replace(/_/g, '%')); }
    catch (e) { return m; }
  });
}

function parseEtiquetas(texto) {
  const labels = texto.match(/\^XA[\s\S]*?\^XZ/g) || [];
  const items = [];
  labels.forEach(lbl => {
    if (!/\^FDEnvio:|sender_id/.test(lbl)) return;
    const fds = [...lbl.matchAll(/\^FD([^\^]*)\^FS/g)].map(m => decodeZpl(m[1]));
    // Empresa remitente: primer campo (arriba a la izquierda)
    let emp = '';
    const empM = lbl.match(/\^FO120,22\^A0N,24,24\^FH?\^FD([^\^]*)\^FS/);
    if (empM) emp = decodeZpl(empM[1]);
    // ID de cuenta del remitente (identificador confiable de la empresa)
    let senderId = '';
    const sidM = lbl.match(/"sender_id":\s*(\d+)/);
    if (sidM) senderId = sidM[1];
    // Comuna: texto grande centrado
    let comuna = '';
    const comM = lbl.match(/\^FO0,660\^A0N,40,40\^FB800,1,0,C\^FH?\^FD([^\^]*)\^FS/);
    if (comM) comuna = decodeZpl(comM[1]);
    // Texto completo para detectar Padre Hurtado / Colina (comuna + dirección)
    const blob = fds.join(' ').toUpperCase();
    const esRural = /PADRE\s+HURTADO|COLINA/.test(comuna.toUpperCase()) || /PADRE\s+HURTADO|COLINA/.test(blob);
    items.push({ emp, senderId, comuna, esRural });
  });
  return items;
}

function resolverEmpresa(rawName, senderId) {
  // 1) Mapeo por sender_id (más confiable)
  if (senderId && REMITENTE_EMPRESA[senderId]) {
    const dest = REMITENTE_EMPRESA[senderId];
    const match = state.empresas.find(e => e.toUpperCase() === dest.toUpperCase());
    return match || dest;
  }
  // 2) Coincidencia por nombre contra empresas registradas
  let s = (rawName || '').split('#')[0].trim();
  const byName = state.empresas.find(e => s.toUpperCase().includes(e.toUpperCase()));
  if (byName) return byName;
  // 3) Limpia nombre duplicado como respaldo
  const half = s.length % 2 === 0 ? s.slice(0, s.length / 2).trim() : s;
  return (s.startsWith(half) && half.length > 2) ? half : s;
}

function seleccionarSiExiste(selectId, valor) {
  const sel = document.getElementById(selectId);
  if (!sel || !valor) return false;
  const opt = [...sel.options].find(o => o.value.toUpperCase() === valor.toUpperCase());
  if (opt) { sel.value = opt.value; return true; }
  return false;
}

function precargarEnvios(input) {
  const file = input.files && input.files[0];
  if (!file) return;
  const resumen = document.getElementById('precarga-resumen');

  const procesarTexto = (texto) => {
    const items = parseEtiquetas(texto);
    if (!items.length) {
      resumen.style.display = 'block';
      resumen.innerHTML = '<div style="margin-top:12px;padding:12px;border:1px solid var(--red);border-radius:8px;color:var(--red);font-size:12px;">⚠ No se encontraron etiquetas válidas en el archivo.</div>';
      return;
    }
    // Agrupa por empresa
    const porEmp = {};
    items.forEach(it => {
      const emp = resolverEmpresa(it.emp, it.senderId) || '(sin empresa)';
      if (!porEmp[emp]) porEmp[emp] = { std: 0, rural: 0 };
      it.esRural ? porEmp[emp].rural++ : porEmp[emp].std++;
    });
    const empresas = Object.keys(porEmp);
    const totalStd = items.filter(i => !i.esRural).length;
    const totalRural = items.filter(i => i.esRural).length;

    // Empresa principal = la de mayor cantidad
    const principal = empresas.slice().sort((a, b) =>
      (porEmp[b].std + porEmp[b].rural) - (porEmp[a].std + porEmp[a].rural))[0];

    // Autollenar campos
    seleccionarSiExiste('f-empresa', principal);
    if (!seleccionarSiExiste('f-transportista', 'Fast Way')) {
      seleccionarSiExiste('f-transportista', 'FastWay');
    }
    seleccionarSiExiste('f-tipo-envio', 'flex');
    toggleTipoEnvio();
    document.getElementById('f-cant-std').value = porEmp[principal].std || '';
    document.getElementById('f-cant-rural').value = porEmp[principal].rural || '';
    updateTotalPaq();

    // Resumen visual
    let filas = empresas.map(e => {
      const d = porEmp[e];
      const marca = e === principal ? ' <span style="color:var(--success);">◀ autollenado</span>' : '';
      return '<tr><td style="padding:5px 8px;">' + e + marca + '</td>' +
             '<td style="padding:5px 8px;text-align:right;">' + d.std + '</td>' +
             '<td style="padding:5px 8px;text-align:right;">' + d.rural + '</td>' +
             '<td style="padding:5px 8px;text-align:right;font-weight:700;">' + (d.std + d.rural) + '</td></tr>';
    }).join('');

    let aviso = empresas.length > 1
      ? '<div style="margin-top:8px;font-size:11px;color:var(--text3);">Se detectaron varias empresas. Se autollenó <b>' + principal + '</b>; registra las demás por separado.</div>'
      : '';

    resumen.style.display = 'block';
    resumen.innerHTML =
      '<div style="margin-top:14px;padding:14px;border:1px solid var(--success);border-radius:10px;background:var(--surface2);">' +
        '<div style="font-size:13px;font-weight:700;margin-bottom:10px;">✓ ' + items.length + ' etiquetas leídas · ' +
          totalStd + ' Standard · ' + totalRural + ' Rural</div>' +
        '<table style="width:100%;border-collapse:collapse;font-size:12px;">' +
          '<thead><tr style="border-bottom:1px solid var(--border);">' +
            '<th style="padding:5px 8px;text-align:left;">Empresa</th>' +
            '<th style="padding:5px 8px;text-align:right;">Standard</th>' +
            '<th style="padding:5px 8px;text-align:right;">Rural</th>' +
            '<th style="padding:5px 8px;text-align:right;">Total</th>' +
          '</tr></thead><tbody>' + filas + '</tbody></table>' +
          aviso +
      '</div>';
  };

  const nombre = file.name.toLowerCase();
  if (nombre.endsWith('.zip')) {
    if (typeof JSZip === 'undefined') {
      resumen.style.display = 'block';
      resumen.innerHTML = '<div style="margin-top:12px;padding:12px;border:1px solid var(--red);border-radius:8px;color:var(--red);font-size:12px;">⚠ No se pudo cargar el lector de ZIP. Descomprime el archivo y sube el .txt.</div>';
      return;
    }
    file.arrayBuffer().then(buf => JSZip.loadAsync(buf)).then(zip => {
      const txtName = Object.keys(zip.files).find(n => n.toLowerCase().endsWith('.txt'));
      if (!txtName) throw new Error('sin txt');
      return zip.files[txtName].async('string');
    }).then(procesarTexto).catch(() => {
      resumen.style.display = 'block';
      resumen.innerHTML = '<div style="margin-top:12px;padding:12px;border:1px solid var(--red);border-radius:8px;color:var(--red);font-size:12px;">⚠ No se pudo leer el ZIP.</div>';
    });
  } else {
    file.text().then(procesarTexto).catch(() => {
      resumen.style.display = 'block';
      resumen.innerHTML = '<div style="margin-top:12px;padding:12px;border:1px solid var(--red);border-radius:8px;color:var(--red);font-size:12px;">⚠ No se pudo leer el archivo.</div>';
    });
  }
}

function initHistFiltros() {
